name: iOS build on demand

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build target (simulator requires NO Apple account/secrets)
        required: true
        default: simulator
        type: choice
        options: [simulator, release]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unsigned Simulator bundle
        if: inputs.variant == 'simulator'
        run: bash scripts/validate-ios.sh
      - name: Prepare release signing
        if: inputs.variant == 'release'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64" || { echo 'IOS_CERTIFICATE_BASE64 is required for signed iOS release.' >&2; exit 1; }
          bash scripts/prepare-ios-signing.sh
      - name: Build signed release IPA
        if: inputs.variant == 'release'
        env:
          ORBIT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ORBIT_IOS_EXPORT_OPTIONS_PLIST: ${{ runner.temp }}/orbit-signing/ExportOptions.plist
        run: bash scripts/release-ios.sh
      - name: Clean temporary signing assets
        if: always() && inputs.variant == 'release'
        run: bash scripts/cleanup-ios-signing.sh || true
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-ios-${{ inputs.variant }}-${{ github.sha }}
          path: releases/ios/
          if-no-files-found: error
          retention-days: 30
