name: Versioned release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version
        run: node scripts/validate-version.mjs "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run export:web

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android release signing secrets before tagging a release.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orbit-release.keystore"
      - name: Build signed APK and app bundle
        env:
          ORBIT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/orbit-release.keystore
          ORBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORBIT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/release-android.sh
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-release-android
          path: releases/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: verify
    # Enable only after a prepared native workspace and approved provisioning
    # are part of the release configuration. Default CI validates the simulator.
    if: vars.ORBIT_IOS_RELEASE_READY == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          IOS_EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_BASE64 }}
        run: bash scripts/prepare-ios-signing.sh
      - name: Archive and export configured iOS targets
        env:
          ORBIT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ORBIT_IOS_EXPORT_OPTIONS_PLIST: ${{ runner.temp }}/orbit-signing/ExportOptions.plist
        run: bash scripts/release-ios.sh
      - name: Remove temporary signing assets
        if: always()
        run: bash scripts/cleanup-ios-signing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-release-ios
          path: releases/ios/export/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [android, ios]
    if: always() && needs.android.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: orbit-release-*
          path: releases/publish/
          merge-multiple: true
      - name: Publish the tag's built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/publish/* --verify-tag --title "Orbit $GITHUB_REF_NAME" --generate-notes
